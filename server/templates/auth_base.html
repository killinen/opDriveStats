<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Engagement Gauge{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; color: #f5f7ff; background: #0b1020; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: radial-gradient(ellipse at top, #25315a, transparent 65%); }
    main { max-width: 760px; margin: 8vh auto; padding: clamp(24px, 5vw, 48px); background: #131a30ed; border: 1px solid #7894ff47; border-radius: 24px; box-shadow: 0 24px 80px #0004; }
    .brand { color: #7dd3fc; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 20px 0 12px; }
    p { color: #a8b2d6; line-height: 1.6; }
    a { color: #7dd3fc; }
    button, .button { display: inline-flex; justify-content: center; align-items: center; gap: 12px; min-height: 46px; padding: 12px 20px; border: 1px solid #7894ff47; border-radius: 10px; background: #eaf2ff; color: #142039; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    button:hover, .button:hover { background: #cfeaff; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 4px; }
    .notice { padding: 14px 18px; background: #7dd3fc12; border: 1px solid #7dd3fc44; border-radius: 12px; }
    .error { border-color: #fda4af66; color: #fecdd3; }
    .small { font-size: .85rem; }
    input { width: 100%; border: 1px solid #7894ff47; border-radius: 8px; background: #0b1020; color: #f5f7ff; padding: 12px; font: inherit; margin: 12px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: .85rem; }
    th, td { text-align: left; padding: 12px 4px; border-bottom: 1px solid #7894ff33; }
    td button { padding: 8px 12px; min-height: 36px; }
    .footer { margin-top: 28px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body><main><span class="brand">Engagement Gauge · Private access</span>{% block content %}{% endblock %}</main></body>
</html>
